<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You Have Died</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Creepster&display=swap" rel="stylesheet">
<style>
  :root { --tower: 80px; --text: #4a4644; --dim: #3a3634; }
  @media (max-width: 600px) { :root { --tower: 44px; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: 'UnifrakturCook', 'Old English Text MT', 'Blackadder ITC', fantasy;
    color: var(--text);
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  /* skull towers */
  .tower {
    position: fixed; top: 0; bottom: 0; width: var(--tower); z-index: 1;
    background-repeat: repeat; background-size: var(--tower) var(--tower);
  }
  .tower.l { left: 0; }
  .tower.r { right: 0; }

  #stage {
    position: fixed; top: 0; bottom: 0; left: var(--tower); right: var(--tower);
    z-index: 2; display: flex; flex-direction: column;
  }

  /* clock */
  #clock {
    flex: none; height: 74px; display: flex; align-items: center; justify-content: center;
    gap: 10px; background: #000; position: relative; z-index: 4;
  }
  #face { width: 56px; height: 56px; animation: twitch 7s infinite steps(1); }
  #digits {
    font-family: 'Creepster', fantasy; font-size: 22px; letter-spacing: 1px;
    color: #6a1717; text-shadow: 0 0 6px #2a0505; animation: flick 3.3s infinite;
  }
  .stopped #digits, .stopped #face { animation: none; }
  .stopped #digits { color: #3d1010; text-shadow: none; }
  @keyframes twitch {
    0%, 93%, 100% { transform: none; }
    94% { transform: translate(1px, -1px) rotate(1deg); }
    96% { transform: translate(-1px, 1px) rotate(-1.5deg); }
    98% { transform: translate(1px, 0); }
  }
  @keyframes flick {
    0%, 100% { opacity: 1; } 41% { opacity: 1; } 42% { opacity: .35; }
    43% { opacity: 1; } 77% { opacity: .6; } 78% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { #digits, #face { animation: none; } }

  #main { flex: 1; position: relative; min-height: 0; }

  /* home */
  #home { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #home h1 {
    margin: 0; padding: 0 14px; max-width: 440px; text-align: center;
    font-size: 22px; line-height: 1.45; font-weight: 700; color: var(--text);
  }
  .abs { position: absolute; }

  /* clickable things: small targets, no borders, no hover reaction */
  .cl {
    position: relative; display: inline-block; font-size: 15px; color: var(--dim);
    padding: 4px 2px; line-height: 1.2; user-select: none; -webkit-user-select: none;
  }
  .cl .lab { pointer-events: none; display: inline-block; }
  .cl .hit {
    position: absolute; left: 50%; top: 50%; width: 14px; height: 10px;
    margin: -5px 0 0 -7px; padding: 0; border: 0; border-radius: 0;
    background: transparent; cursor: default; color: inherit; font: inherit;
  }
  .cl .hit:focus-visible { outline: 1px solid #2a2625; }

  /* panels */
  #panel { position: absolute; inset: 0; overflow-y: auto; background: #000; padding: 6px 14px 70px; }
  #panel[hidden] { display: none; }
  .box { max-width: 560px; margin: 0 auto; }
  .box h2 { font-size: 20px; font-weight: 700; margin: 8px 0 14px; color: var(--text); }
  .box p { line-height: 1.5; margin: 0 0 14px; }
  .card { background: #070707; padding: 22px 20px 12px; text-align: left; }
  .card p { text-align: left; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
  .foot { display: flex; justify-content: flex-end; margin-top: 16px; }
  .big { font-size: 40px; letter-spacing: 3px; color: #4d4846; margin: 6px 0 18px; }
  .stars { font-size: 18px; letter-spacing: 3px; color: #4d4846; }
  .items { display: flex; flex-wrap: wrap; gap: 14px 26px; margin-top: 22px; }
  .q { margin: 0 0 16px; }
  .q label.t { display: block; margin-bottom: 6px; }
  fieldset { border: 0; margin: 18px 0 0; padding: 0; }
  legend { padding: 0; margin-bottom: 6px; }
  .opt { display: flex; align-items: center; gap: 10px; margin: 9px 0; cursor: default; }
  .opt input { accent-color: #3a1818; margin: 0; }

  input[type=text], textarea {
    display: block; width: 100%; background: #090909; color: #544f4d; font: inherit; font-size: 16px;
    border: 0; border-bottom: 1px solid #201d1c; padding: 8px 6px; outline: none; border-radius: 0;
  }
  textarea { min-height: 120px; resize: vertical; border: 1px solid #201d1c; }
  input[type=text]:focus, textarea:focus { border-color: #35302e; }
  input::placeholder, textarea::placeholder { color: #2c2928; }
  .narrow { max-width: 220px; }
  .filter { margin-top: 18px; max-width: 280px; }
  .filter[hidden] { display: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; }

  /* error bar: bottom of the screen, dusty gray */
  #err {
    position: absolute; left: 0; right: 0; bottom: 10px; z-index: 6; text-align: center;
    color: #8f8a84; font-size: 15px; padding: 0 12px; pointer-events: none; min-height: 1.2em;
  }
</style>
</head>
<body>
<noscript>This page needs JavaScript.</noscript>

<div class="tower l"></div>
<div class="tower r"></div>

<div id="stage">
  <div id="clock" role="timer" aria-label="elapsed time">
    <svg id="face" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="#050505" stroke="#2a0c0c" stroke-width="3"/>
      <g stroke="#3a1212" stroke-width="2">
        <line x1="50" y1="6" x2="50" y2="14" stroke="#6a1717"/>
        <line x1="72" y1="12" x2="68" y2="19"/>
        <line x1="88" y1="28" x2="81" y2="32"/>
        <line x1="94" y1="50" x2="86" y2="50"/>
        <line x1="88" y1="72" x2="81" y2="68"/>
        <line x1="72" y1="88" x2="68" y2="81"/>
        <line x1="50" y1="94" x2="50" y2="86"/>
        <line x1="28" y1="88" x2="32" y2="81"/>
        <line x1="12" y1="72" x2="19" y2="68"/>
        <line x1="6" y1="50" x2="14" y2="50"/>
        <line x1="12" y1="28" x2="19" y2="32"/>
        <line x1="28" y1="12" x2="32" y2="19"/>
      </g>
      <line id="hh" x1="50" y1="50" x2="50" y2="28" stroke="#4a1111" stroke-width="3" stroke-linecap="round"/>
      <line id="mh" x1="50" y1="50" x2="50" y2="18" stroke="#5a1414" stroke-width="2.4" stroke-linecap="round"/>
      <line id="sh" x1="50" y1="56" x2="50" y2="10" stroke="#7a1a1a" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="3.2" fill="#7a1a1a"/>
    </svg>
    <span id="digits">00:00:00.00</span>
  </div>

  <div id="main">
    <div id="home">
      <h1>You have died. Please enter your information to get your options and select your afterlife experience.</h1>
    </div>
    <div id="panel" hidden></div>
  </div>

  <div id="err" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';
  var T0 = performance.now(); // page load

  /* ---------- tiny helpers ---------- */
  function $(s) { return document.querySelector(s); }
  function el(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  /* a clickable-looking thing: visible label, much smaller real target */
  function cl(label, fn, cls, aria) {
    var lab = el('span', { class: 'lab' });
    if (typeof label === 'string') lab.textContent = label; else lab.append(label);
    var b = el('button', { class: 'hit', type: 'button', 'aria-label': aria || (typeof label === 'string' ? label : 'menu') });
    if (fn) b.addEventListener('click', fn);
    return el('span', { class: 'cl ' + (cls || '') }, lab, b);
  }
  function onEnter(input, fn) {
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); fn(); } });
  }

  /* ---------- errors: bottom of screen, dusty gray ---------- */
  var errTimer;
  function err(msg) {
    var e = $('#err'); e.textContent = msg;
    clearTimeout(errTimer);
    errTimer = setTimeout(function () { e.textContent = ''; }, 7000);
  }
  function clearErr() { clearTimeout(errTimer); $('#err').textContent = ''; }

  /* ---------- skull towers ---------- */
  (function towers() {
    function skull(x, y) {
      return '<g transform="translate(' + x + ',' + y + ')">' +
        '<path d="M20 2C10 2 3 9 3 19c0 6 3 10 7 12v5h20v-5c4-2 7-6 7-12C37 9 30 2 20 2z" fill="rgb(50,48,46)"/>' +
        '<circle cx="13" cy="18" r="4.5" fill="black"/><circle cx="27" cy="18" r="4.5" fill="black"/>' +
        '<path d="M20 23l-3 6h6z" fill="black"/>' +
        '<path d="M14 31v5M20 31v5M26 31v5" stroke="black" stroke-width="1.6"/></g>';
    }
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">' +
      skull(0, 0) + skull(40, 0) + skull(-20, 40) + skull(20, 40) + skull(60, 40) + '</svg>';
    var url = 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
    document.querySelectorAll('.tower').forEach(function (t) { t.style.backgroundImage = url; });
  })();

  /* ---------- clock ---------- */
  var clockStopped = false, lastSec = -1, clockTimer;
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function rot(id, a) { $(id).setAttribute('transform', 'rotate(' + a + ' 50 50)'); }
  function tick() {
    var ms = Math.floor(performance.now() - T0);
    var cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60,
        m = Math.floor(ms / 60000) % 60, h = Math.floor(ms / 3600000);
    $('#digits').textContent = pad(h) + ':' + pad(m) + ':' + pad(s) + '.' + pad(cs);
    if (s !== lastSec) {
      lastSec = s;
      rot('#sh', s * 6 + 5);
      setTimeout(function () { rot('#sh', s * 6); }, 90);
    }
    rot('#mh', m * 6 + s * 0.1);
    rot('#hh', (h % 12) * 30 + m * 0.5);
  }
  tick();
  clockTimer = setInterval(tick, 40);
  function stopClock() {
    if (clockStopped) return;
    clockStopped = true; clearInterval(clockTimer); tick();
    $('#clock').classList.add('stopped');
  }

  /* ---------- content ---------- */
  var DEATHS = [
    { name: 'a rogue shopping cart', stories: [
      'you were carrying one bag of oranges across the parking lot when a cart that had been rolling free since the north end picked up speed on the slow slope by the cart return and nobody saw it coming least of all you and honestly it was kind of majestic',
      'you stopped to check your phone right in the middle of the lane and a train of eleven carts that an employee had lost control of rolled in behind you quietly like a parade nobody planned' ] },
    { name: 'a very confident goose', stories: [
      'you tried to walk past the pond like you do every morning but this goose had decided the path was its path now and it looked you dead in the eye and you made the mistake of not backing down',
      'you were holding a half eaten sandwich near the water and the goose treated it as a formal declaration and honestly the goose had the crowd on its side' ] },
    { name: 'a wet floor sign', stories: [
      'you saw the sign and you respected the sign but the sign was standing in the dry part and the wet part was somewhere you were not expecting and the whole thing happened very fast and also very slowly',
      'you were tiptoeing around the yellow sign like a person who knows better and then you stepped back to admire your own caution and that is when the floor made its point' ] },
    { name: 'an overheated waffle iron', stories: [
      'it was the continental breakfast at a hotel you did not even like and the last waffle was the one everyone wanted and the iron had been on since before you were born apparently',
      'you flipped it because the little light said it was ready but the little light had been wrong for years and everyone in the lobby knew except you' ] },
    { name: 'a falling piano', stories: [
      'you were just standing on a sidewalk minding your business which is the thing people say and in this case it was true because the movers had taken a shortcut and gravity took care of the rest',
      'it was a very nice piano actually an upright with a good tone and you heard one note on the way down which was a little flat' ] },
    { name: 'an unattended trampoline', stories: [
      'someone left it out in the yard with the net open and you thought just one bounce and the second bounce thought otherwise and the third bounce took you somewhere over the fence and past the point of being able to explain',
      'it was your nephews birthday and you said you were not going to jump and then you jumped and the ground arrived early' ] },
    { name: 'a vending machine that did not give up', stories: [
      'your dollar went in and the bag of chips hung there by one corner so you gave the machine a friendly nudge and then a less friendly nudge and the machine decided to answer all at once',
      'it ate two dollars and then a third dollar so you were not leaving without your snack and the machine knew it and leaned in' ] },
    { name: 'a malfunctioning revolving door', stories: [
      'you went in at a normal pace and it decided to go faster and the people on the other side were waving or maybe screaming and you were stuck in a loop of your own reflection until the loop ended',
      'the door had been making that noise all week and everyone had agreed to ignore it and today was the day that agreement was tested' ] },
    { name: 'an escalator that kept going', stories: [
      'you reached the top and the floor was supposed to be there like it always is but the stairs just kept folding forward and you stood there in the middle of the mall thinking this is a strange place to be',
      'you were looking at your phone and the escalator had a plan of its own and by the time you looked up the plan was complete' ] },
    { name: 'an avalanche of casserole', stories: [
      'it was a potluck and the table had one too many dishes stacked on one too many dishes and when you reached for a spoon the whole structure remembered it was only held up by good intentions',
      'somebodys aunt had made it in a pan that was too big and brought it in a car that was too small and you were just standing in the wrong place at the right time' ] }
  ];
  var ANGELS = ['111', '222', '333', '444', '555', '777', '888', '999', '1111', '1212', '1234'];

  /* ---------- the (many) experiences, seeded so they never change ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var NAMES = ['mountain','grocery store','childhood bedroom','star in galaxy','lighthouse','library at midnight','laundromat','drive-in theater','treehouse','empty swimming pool','bus station','hot air balloon','desert highway','aquarium after hours','snow globe','grandmothers kitchen','rooftop garden','submarine','lake cabin','carnival','bowling alley','roller rink','airport lounge','hammock','cornfield','cloud','crystal cave','ferris wheel','bookstore','apple orchard','tugboat','train dining car','thrift store','hotel pool','sunflower field','tidepool','ice rink','planetarium','barbershop','diner booth','comic shop','skate park','observatory','swamp boat','bamboo forest','mini golf course','pillow fort','houseboat','beach at dusk','igloo','windmill','castle tower','canyon','sailboat','hot spring','monastery','pet store','arcade','back seat of a road trip','school gym','community pool','sandbox','bakery at 4am','waiting room','elevator','parking garage roof','cul-de-sac','ski lodge','rainforest canopy','moon crater','asteroid belt','nebula','edge of a black hole','tiny island','glacier','volcano rim','farmers market','drive-thru','art museum','subway car','record store','rooftop pool','attic','basement couch','garage band practice','camping tent','vending machine alcove','toll booth','hay loft','ice cream truck','gazebo','kayak','water tower','coral reef','quiet suburb at noon','movie theater lobby','night market','tea house','greenhouse','clock tower','boardwalk','cabin in the snow','abandoned mall','waterfall','meadow','rowboat on a pond','desert oasis','fireworks hill','old gym bleachers','shoreline at low tide','orchestra pit','lakeside dock','campfire','porch swing','paper boat','bathtub','foggy harbor','hilltop windmill','sleeper train','jungle gym','drive across a bridge','stargazing field','spaceship window seat','hammock between two trees'];
  var DESC_A = [
    'Quiet, with the lighting you remember.',
    'Mostly warm, with a faint hum you stop noticing.',
    'The air smells like something from before you could read.',
    'Everything is the right size, just slightly off.',
    'A soft light follows you around without asking.',
    'It is always about four in the afternoon here.',
    'Time moves, but only when you are not looking.',
    'The ground feels familiar even where it should not.',
    'Sounds arrive a moment after they happen.',
    'Nobody is in a rush, including the sky.'
  ];
  var DESC_B = [
    'Snacks are available but nobody is sure who stocks them.',
    'The weather is whatever you were hoping for.',
    'A faint song plays and you never learn what it is.',
    'Someone you almost know walks by now and then.',
    'There is a chair with your name on it, spelled slightly wrong.',
    'You can stay as long as you like, which is a long time.',
    'Pets are welcome, including ones you used to have.',
    'There is a window, and it always has a good view.',
    'Visitors are rare but always polite.',
    'You will never be fully sure where the exit is.'
  ];
  var EXPS = (function () {
    var rnd = mulberry32(20261001);
    function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
    var order = NAMES.slice();
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1)); var t = order[i]; order[i] = order[j]; order[j] = t;
    }
    // tiles cover every integer so every number can reach at least one experience
    var tiles = [[-Infinity, -301]];
    for (var s = -300; s <= 700; s += 50) tiles.push([s, s + 49]);
    tiles.push([750, Infinity]);
    return order.map(function (name, idx) {
      var lo, hi;
      if (idx < tiles.length) { lo = tiles[idx][0]; hi = tiles[idx][1]; }
      else { lo = ri(-300, 800); hi = lo + ri(10, 140); }
      return { name: name, lo: lo, hi: hi, stars: ri(1, 5),
               desc: DESC_A[ri(0, DESC_A.length - 1)] + ' ' + DESC_B[ri(0, DESC_B.length - 1)] };
    });
  })();
  function rangeText(e) {
    if (e.lo === -Infinity) return e.hi + ' and below';
    if (e.hi === Infinity) return e.lo + ' and above';
    return e.lo + ' to ' + e.hi;
  }

  /* ---------- state ---------- */
  var state = {
    death: null, story: null, options: null,
    first: '', last: '', choice: '', angel: null, verifyDone: false,
    lastWords: '',
    draft: { littered: '', goodmorning: '', yelled: '', charity: '' },
    answers: null, number: null, formDone: false,
    next: '', filter: null, confirmed: null
  };
  var galScroll = 0;

  /* ---------- panel plumbing ---------- */
  function openPanel(node) {
    clearErr();
    var p = $('#panel');
    p.hidden = false; p.replaceChildren(node); p.scrollTop = 0;
    $('#home').inert = true;
  }
  function closePanel() {
    clearErr();
    var p = $('#panel');
    p.hidden = true; p.replaceChildren();
    $('#home').inert = false;
  }

  /* ---------- home ---------- */
  (function buildHome() {
    var h = $('#home');
    function put(label, fn, style) {
      var c = cl(label, fn, 'abs'); Object.assign(c.style, style); h.append(c);
    }
    put('verify identity', openVerify, { top: '10px', left: '10px' });
    put('pick experience', function () {
      if (!state.formDone) return err('you have to fill out form first');
      if (state.confirmed) return openConfirmed();
      galScroll = 0; openGallery();
    }, { top: '10px', right: '10px' });
    put('fill out form', function () {
      if (!state.verifyDone) return err('you have to verify identity first');
      openForm();
    }, { bottom: '58px', right: '10px' });
    put('pick whos next', openNext, { bottom: '58px', left: '10px' });
    put('only a few others like you', null, { top: '70%', left: '10px' });
    put('had a good run', null, { top: '22%', right: '10px' });
  })();

  /* ---------- verify identity ---------- */
  function ensureDeath() {
    if (state.death) return;
    var d = pick(DEATHS);
    state.death = d.name; state.story = pick(d.stories);
    var others = shuffle(DEATHS.filter(function (x) { return x.name !== d.name; })).slice(0, 4)
      .map(function (x) { return x.name; });
    state.options = shuffle([d.name].concat(others));
  }
  function openVerify() {
    ensureDeath();
    var text = 'Hi you died by ' + state.death + ' what had happened was ' + state.story +
      ' from here on out you just have to do a few thing a ma bops and we will send you on your way. ' +
      'first you want to give a recount of your life and experiences and go over a bunch of stuff well not too many ' +
      'and after that you will have some options of places to go from there lucky you get a pick but there may be some tricks ' +
      'so pick wisely there may be some other stuff but you dont have to do it so yeah its fine im sure youll find your way!';
    openPanel(el('div', { class: 'box' },
      el('div', { class: 'card' },
        el('p', { text: text }),
        el('div', { class: 'row' }, cl('next', openName), cl('last words', openLast))),
      el('div', { class: 'foot' }, cl('away', closePanel))));
  }
  function openLast() {
    var ta = el('textarea', { 'aria-label': 'last words', placeholder: 'say it' });
    ta.value = state.lastWords;
    openPanel(el('div', { class: 'box' },
      el('h2', { text: 'last words' }), ta,
      el('div', { class: 'row' },
        cl('away', openVerify),
        cl('okay', function () {
          var v = ta.value.trim();
          if (!v) return err('you have to say something');
          state.lastWords = v; openVerify();
        }))));
  }
  function openName() {
    var f = el('input', { type: 'text', placeholder: 'first name', 'aria-label': 'first name', autocomplete: 'off' });
    var l = el('input', { type: 'text', placeholder: 'last name', 'aria-label': 'last name', autocomplete: 'off' });
    f.value = state.first; l.value = state.last;
    var fs = el('fieldset', {}, el('legend', { text: 'how did you die' }));
    state.options.forEach(function (o) {
      var r = el('input', { type: 'radio', name: 'death', value: o });
      if (state.choice === o) r.checked = true;
      fs.append(el('label', { class: 'opt' }, r, el('span', { text: o })));
    });
    openPanel(el('div', { class: 'box' },
      el('h2', { text: 'who were you' }),
      el('div', { class: 'q' }, f), el('div', { class: 'q' }, l), fs,
      el('div', { class: 'row' },
        cl('away', closePanel),
        cl('okay', function () {
          var fv = f.value.trim(), lv = l.value.trim();
          var c = document.querySelector('input[name=death]:checked');
          if (!fv || !lv) return err('we need a first and last name');
          if (!c) return err('pick how you died');
          if (c.value !== state.death) return err('that is not how you died');
          state.first = fv; state.last = lv; state.choice = c.value;
          openAngel();
        }))));
  }
  function openAngel() {
    if (!state.angel) state.angel = pick(ANGELS);
    openPanel(el('div', { class: 'box' },
      el('h2', { text: 'your angel number' }),
      el('p', { class: 'big', text: state.angel }),
      el('p', { text: 'remember this' }),
      el('div', { class: 'row' },
        cl('away', closePanel),
        cl('okay', function () { state.verifyDone = true; closePanel(); }))));
  }

  /* ---------- fill out form ---------- */
  var QUESTIONS = [
    ['littered', 'how many times have you littered (best estimate)'],
    ['goodmorning', 'how many times have you said goodmorning to strangers'],
    ['yelled', 'how many times have you yelled'],
    ['charity', 'how many times have you donated to charity']
  ];
  function openForm() {
    if (state.answers && !state.draft.littered && !state.draft.charity) state.draft = Object.assign({}, state.answers);
    var inputs = {};
    var box = el('div', { class: 'box' }, el('h2', { text: 'a few questions' }));
    QUESTIONS.forEach(function (q, i) {
      var id = 'q' + i;
      var inp = el('input', { type: 'text', id: id, inputmode: 'numeric', autocomplete: 'off' });
      inp.value = state.draft[q[0]]; inputs[q[0]] = inp;
      box.append(el('div', { class: 'q' }, el('label', { class: 't', for: id, text: q[1] }), inp));
    });
    box.append(el('div', { class: 'row' },
      cl('away', closePanel),
      cl('okay', function () {
        var out = {};
        for (var i = 0; i < QUESTIONS.length; i++) {
          var k = QUESTIONS[i][0], v = inputs[k].value.trim();
          state.draft[k] = v;
          if (!/^\d+$/.test(v) || !Number.isSafeInteger(Number(v))) return err('those have to be whole numbers');
          out[k] = Number(v);
        }
        openFormNumber(out);
      })));
    openPanel(box);
  }
  function sameAnswers(a, b) {
    return a && b && QUESTIONS.every(function (q) { return Number(a[q[0]]) === Number(b[q[0]]); });
  }
  function openFormNumber(a) {
    var inp = el('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', 'aria-label': 'your number', placeholder: 'your number', class: 'narrow' });
    if (state.formDone && sameAnswers(state.answers, a)) inp.value = String(state.number);
    function submit() {
      var v = inp.value.trim();
      if (!/^-?\d+$/.test(v)) return err('that is not a number');
      var expected = a.charity + a.goodmorning - a.littered + a.yelled;
      if (Number(v) !== expected) return err('that is not your number');
      state.answers = Object.assign({}, a); state.number = expected; state.formDone = true;
      closePanel();
    }
    onEnter(inp, submit);
    openPanel(el('div', { class: 'box' },
      el('p', { text: 'Your number is charity + goodmorning - littered + yelled' }),
      inp,
      el('div', { class: 'row' }, cl('away', openForm), cl('okay', submit))));
    inp.focus();
  }

  /* ---------- pick whos next ---------- */
  function openNext() {
    var inp = el('input', { type: 'text', placeholder: 'a name', 'aria-label': 'name', autocomplete: 'off' });
    inp.value = state.next;
    function submit() {
      var v = inp.value.trim();
      if (!v) return err('you have to type a name');
      state.next = v; closePanel();
    }
    onEnter(inp, submit);
    openPanel(el('div', { class: 'box' },
      el('h2', { text: 'who is next to die' }), inp,
      el('div', { class: 'row' }, cl('away', closePanel), cl('okay', submit))));
    inp.focus();
  }

  /* ---------- pick experience ---------- */
  function menuIcon() {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('width', '28'); s.setAttribute('height', '18'); s.setAttribute('viewBox', '0 0 28 18');
    [3, 9, 15].forEach(function (y) {
      var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', '2'); l.setAttribute('x2', '26'); l.setAttribute('y1', y); l.setAttribute('y2', y);
      l.setAttribute('stroke', '#3d3937'); l.setAttribute('stroke-width', '2');
      s.append(l);
    });
    return s;
  }
  function openGallery() {
    var list = el('div', { class: 'items' });
    var numf = el('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: 'number', 'aria-label': 'number' });
    var fp = el('div', { class: 'filter', hidden: '' }, numf);
    function render() {
      var shown = EXPS.filter(function (e) { return state.filter === null || (state.filter >= e.lo && state.filter <= e.hi); });
      list.replaceChildren.apply(list, shown.map(function (e) {
        return cl(e.name, function () { galScroll = $('#panel').scrollTop; openDetail(e); }, 'item');
      }));
      return shown.length;
    }
    function apply() {
      var v = numf.value.trim();
      if (v === '') state.filter = null;
      else if (!/^-?\d+$/.test(v) || !Number.isSafeInteger(Number(v))) return err('that is not a number');
      else state.filter = Number(v);
      var n = render();
      if (state.filter !== null && n === 0) err('nothing matched');
      else clearErr();
    }
    onEnter(numf, apply);
    fp.append(el('div', { class: 'row' }, cl('okay', apply)));
    render();
    openPanel(el('div', { class: 'box' },
      el('div', { class: 'bar' },
        cl(menuIcon(), function () { fp.hidden = !fp.hidden; if (!fp.hidden) numf.focus(); }, '', 'menu'),
        cl('away', closePanel)),
      fp, list));
    $('#panel').scrollTop = galScroll;
  }
  function openDetail(e) {
    openPanel(el('div', { class: 'box' },
      el('h2', { text: e.name }),
      el('p', { text: e.desc }),
      el('p', { class: 'stars', 'aria-label': e.stars + ' out of 5 stars', text: '\u2605'.repeat(e.stars) + '\u2606'.repeat(5 - e.stars) }),
      el('p', { text: 'open to numbers ' + rangeText(e) }),
      el('div', { class: 'row' },
        cl('away', function () { openGallery(); }),
        cl('mine', function () {
          if (state.number < e.lo || state.number > e.hi) return err('your number cannot take this one');
          openPickAngel(e);
        }))));
  }
  function openPickAngel(e) {
    var inp = el('input', { type: 'text', autocomplete: 'off', placeholder: 'angel number', 'aria-label': 'angel number', class: 'narrow' });
    function submit() {
      if (inp.value.trim() !== state.angel) return err('that is not your angel number');
      state.confirmed = e; stopClock(); openConfirmed();
    }
    onEnter(inp, submit);
    openPanel(el('div', { class: 'box' },
      el('h2', { text: 'enter your angel number' }), inp,
      el('div', { class: 'row' }, cl('away', function () { openDetail(e); }), cl('okay', submit))));
    inp.focus();
  }
  function openConfirmed() {
    openPanel(el('div', { class: 'box' },
      el('h2', { text: 'your afterlife experience is confirmed' }),
      el('p', { text: state.confirmed.name }),
      el('div', { class: 'foot' }, cl('okay', closePanel))));
  }
})();
</script>
</body>
</html>
