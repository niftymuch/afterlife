<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afterlife Intake</title>
  <meta name="description" content="You have died. Please fill out the form.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%92%80%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tower tower-left" aria-hidden="true"></div>
  <div class="tower tower-right" aria-hidden="true"></div>

  <main class="stage">
    <noscript><p>This page needs JavaScript. The dead are not very patient.</p></noscript>

    <!-- HOME -->
    <section id="view-home" class="view" aria-labelledby="home-title">
      <div class="home">
        <div class="home-intro">
          <h1 id="home-title" tabindex="-1">You have died.</h1>
          <p>Please enter your information to get your options and select your afterlife experience.</p>
          <p id="bound" class="bound" hidden></p>
        </div>
        <button type="button" class="ghost pos-tl" data-action="form">fill out form</button>
        <button type="button" class="ghost pos-tr" data-action="pick">pick experience</button>
        <button type="button" class="ghost pos-br" data-action="verify">verify identity</button>
        <p id="gate-msg" class="gate-msg" role="status" aria-live="polite"></p>
      </div>
      <p class="footer"><button type="button" class="link" id="reset">reincarnate (start over)</button></p>
    </section>

    <!-- VERIFY IDENTITY -->
    <section id="view-verify" class="view" hidden aria-labelledby="verify-title">
      <div class="view-head">
        <h2 id="verify-title" class="view-title" tabindex="-1">verify identity</h2>
        <button type="button" class="link" data-home>return</button>
      </div>

      <div id="v-guide" class="sub box">
        <p id="guide-text" class="guide"></p>
        <p id="guide-note" class="note" role="status" aria-live="polite"></p>
        <div class="row">
          <button type="button" class="btn" id="v-lastwords">last words</button>
          <button type="button" class="btn" id="v-next">next</button>
        </div>
      </div>

      <div id="v-last" class="sub box" hidden>
        <form id="last-form" novalidate>
          <label for="lw-text">Your last words</label>
          <textarea id="lw-text" class="field" rows="6" maxlength="600" placeholder="say it now or forever hold your peace"></textarea>
          <p id="lw-error" class="error" role="alert"></p>
          <div class="row">
            <button type="button" class="btn" id="lw-back">back</button>
            <button type="submit" class="btn">send</button>
          </div>
        </form>
      </div>

      <div id="v-name" class="sub box" hidden>
        <form id="name-form" novalidate>
          <label for="first">First name</label>
          <input id="first" class="field" type="text" maxlength="40" autocomplete="off">
          <label for="last">Last name</label>
          <input id="last" class="field" type="text" maxlength="40" autocomplete="off">
          <p id="name-error" class="error" role="alert"></p>
          <div class="row">
            <button type="button" class="btn" id="name-back">back</button>
            <button type="submit" class="btn">next</button>
          </div>
        </form>
      </div>

      <div id="v-cause" class="sub box" hidden>
        <form id="cause-form" novalidate>
          <fieldset>
            <legend>How did you die?</legend>
            <div id="cause-options"></div>
          </fieldset>
          <p id="cause-error" class="error" role="alert"></p>
          <div class="row">
            <button type="button" class="btn" id="cause-back">back</button>
            <button type="submit" class="btn">next</button>
          </div>
        </form>
      </div>

      <div id="v-angel" class="sub box" hidden>
        <p>Your angel number is</p>
        <p id="angel-number" class="big-number"></p>
        <p>Remember this.</p>
        <div class="row">
          <button type="button" class="btn" id="angel-back">back</button>
          <button type="button" class="btn" id="angel-submit">submit</button>
        </div>
      </div>

      <div id="v-summary" class="sub box" hidden>
        <dl id="identity-list" class="summary"></dl>
      </div>
    </section>

    <!-- FILL OUT FORM -->
    <section id="view-form" class="view" hidden aria-labelledby="form-title">
      <div class="view-head">
        <h2 id="form-title" class="view-title" tabindex="-1">fill out form</h2>
        <button type="button" class="link" data-home>return</button>
      </div>

      <div id="f-question" class="sub box">
        <form id="q-form" novalidate>
          <p class="progress" id="q-progress"></p>
          <label for="q-input" id="q-label"></label>
          <input id="q-input" class="field" type="text" inputmode="numeric" maxlength="6" autocomplete="off">
          <p id="q-error" class="error" role="alert"></p>
          <div class="row">
            <button type="button" class="btn" id="q-prev">previous</button>
            <button type="submit" class="btn">next</button>
          </div>
        </form>
      </div>

      <div id="f-calc" class="sub box" hidden>
        <form id="calc-form" novalidate>
          <p class="formula">Your number is charity + goodmorning - littered + yelled</p>
          <label for="calc-input">Enter your number</label>
          <input id="calc-input" class="field" type="text" inputmode="numeric" maxlength="12" autocomplete="off">
          <p id="calc-error" class="error" role="alert"></p>
          <div class="row">
            <button type="button" class="btn" id="calc-prev">previous</button>
            <button type="submit" class="btn">submit</button>
          </div>
        </form>
      </div>

      <div id="f-summary" class="sub box" hidden>
        <dl id="form-list" class="summary"></dl>
      </div>
    </section>

    <!-- PICK EXPERIENCE -->
    <section id="view-pick" class="view" hidden aria-labelledby="pick-title">
      <div class="view-head">
        <button type="button" class="burger" id="menu-btn" aria-label="filter by your number" aria-expanded="false" aria-controls="filter-panel">
          <span></span><span></span><span></span>
        </button>
        <h2 id="pick-title" class="view-title" tabindex="-1">pick experience</h2>
        <button type="button" class="link" data-home>return</button>
      </div>

      <div id="filter-panel" class="box filter" hidden>
        <form id="filter-form" novalidate>
          <label for="filter-input">Your number</label>
          <input id="filter-input" class="field" type="text" inputmode="numeric" maxlength="12" autocomplete="off">
          <p id="filter-error" class="error" role="alert"></p>
          <div class="row">
            <button type="button" class="btn" id="filter-clear">clear</button>
            <button type="submit" class="btn">filter</button>
          </div>
        </form>
      </div>

      <p id="grid-count" class="count" role="status" aria-live="polite"></p>
      <ul id="grid" class="grid"></ul>
    </section>

    <!-- ARRIVED -->
    <section id="view-arrived" class="view" hidden aria-labelledby="arrived-title">
      <div class="box center">
        <h2 id="arrived-title" class="view-title" tabindex="-1">you have been sent to</h2>
        <p id="arrived-name" class="big-number"></p>
        <p id="arrived-desc"></p>
        <div class="row center-row">
          <button type="button" class="btn" data-home>return to the front desk</button>
        </div>
      </div>
    </section>
  </main>

  <!-- EXPERIENCE DETAIL -->
  <div id="modal" class="backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <h2 id="m-title" class="view-title"></h2>
      <p id="m-desc"></p>
      <p><span id="m-stars" role="img"></span></p>
      <p id="m-range"></p>
      <p id="m-msg" class="error" role="alert"></p>
      <form id="m-angel-form" novalidate hidden>
        <label for="m-angel-input">Enter your angel number</label>
        <input id="m-angel-input" class="field" type="text" inputmode="numeric" maxlength="12" autocomplete="off">
        <div class="row">
          <button type="button" class="btn" id="m-angel-cancel">cancel</button>
          <button type="submit" class="btn">confirm</button>
        </div>
      </form>
      <div class="row" id="m-actions">
        <button type="button" class="btn" id="m-close">close</button>
        <button type="button" class="btn" id="m-choose">choose this</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
